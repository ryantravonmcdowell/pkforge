name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (including population fits and the dataset download)
        run: pytest -q
      - name: End-to-end demo
        run: pkforge demo --out-dir demo_output
      - name: Fit the real theophylline data
        run: pkforge theoph --weight --report demo_output/theoph_report.html
      - name: Upload reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: demo_output/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pkforge .
      - name: Run the demo in the container
        run: docker run --rm pkforge
